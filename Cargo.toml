[package]
name = "corium"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/pichi-vm/corium"
publish = false
description = "Minimal initramfs init: mount a read-only Carapace root and execute /sbin/init."

# The library holds the testable boot logic; the binary is the PID 1 entry point.
[[bin]]
name = "corium"
path = "src/main.rs"
test = false

[lib]

# corium is the Linux guest `/init` — its whole library is
# `#![cfg(target_os = "linux")]`. Gate the syscall/carapace deps to Linux too,
# so cross-platform consumers (the `pichi` CLI's vm-tests build on Windows /
# macOS) don't compile the Linux dm + ioctl stack (carapace → devmap-linux →
# iocuddle) they never use.
[target.'cfg(target_os = "linux")'.dependencies]
log = { version = "0.4", features = ["std", "kv"] }
# Read-side carapace discovery and assembly from its trusted root.
carapace = { git = "https://github.com/pichi-vm/carapace", rev = "99caf7941ac8930a5761f6f843b6d8e53dd89587" }
# Safe Linux syscall wrappers, including pivot_root and console fd setup.
rustix = { version = "1", default-features = false, features = ["std", "fs", "process", "mount", "system", "stdio"] }

# Keep the initramfs binary small using stable Cargo settings.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
type_complexity = "allow"
similar_names = "allow"
struct_field_names = "allow"
needless_continue = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
too_many_lines = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
uninlined_format_args = "allow"

[target.'cfg(target_os = "linux")'.dev-dependencies]
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
