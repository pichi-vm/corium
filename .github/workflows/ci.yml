name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  license-headers:
    name: license headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: korandoru/hawkeye@v6

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  commit-messages:
    name: commit messages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pipx run gitlint --commits "origin/${{ github.base_ref || 'main' }}..HEAD"

  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features

  # Independent of the toolchain and musl matrices, and of the VM boot
  # workflow on ubuntu-26.04. Packaging-only flakes stay on this one
  # runner. Copr runs this Makefile as root with dnf; here we install
  # the same tools via apt + rustup and pass DNF=true so the recipe
  # skips dnf on Ubuntu.
  copr-srpm:
    name: copr srpm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install rpmbuild tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm xz-utils gzip
      - name: Install Rust toolchain
        run: rustup show
      - name: Build SRPM
        run: |
          set -euo pipefail
          outdir=$(mktemp -d)
          make -f .copr/Makefile srpm \
            spec="$PWD/packaging/corium.spec" \
            outdir="$outdir" \
            DNF=true
          shopt -s nullglob
          srpms=("$outdir"/*.src.rpm)
          test "${#srpms[@]}" -eq 1
          echo "built ${srpms[0]}"
          test ! -e vendor

  # Rootless QEMU/KVM boot coverage runs separately; see CONTRIBUTING.md.
  test:
    name: test (${{ matrix.toolchain }})
    strategy:
      matrix:
        toolchain: [stable, "1.89.0"]
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  musl:
    name: static init (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --target ${{ matrix.target }}
