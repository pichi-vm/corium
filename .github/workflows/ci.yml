name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  license-headers:
    name: license headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: korandoru/hawkeye@v6

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  commit-messages:
    name: commit messages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - run: pipx run gitlint --commits "origin/${{ github.base_ref || 'main' }}..HEAD"

  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features

  # Independent of the toolchain and musl matrices, and of the VM boot
  # workflow on ubuntu-26.04. Packaging-only flakes stay on this one
  # runner. Copr runs this Makefile as root with dnf on Fedora; here we
  # do the same in a Fedora 43 container, then rebuild the SRPM into an
  # x86_64 RPM to catch spec and build errors before Copr does.
  copr-srpm:
    name: copr srpm
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:43
    timeout-minutes: 30
    steps:
      - name: Install tools
        run: dnf -y install git-core make 'dnf-command(builddep)' rpm-build rpmdevtools

      - uses: actions/checkout@v7.0.1

      - name: Build SRPM (Copr make_srpm)
        shell: bash
        run: |
          set -euo pipefail
          # Test the RPM path in a source tree without Debian's vendor data.
          worktree=$(mktemp -d)
          git archive HEAD | tar --exclude=vendor --exclude=.cargo -x -C "$worktree"
          cd "$worktree"
          outdir=$(mktemp -d)
          make -f .copr/Makefile srpm \
            spec="$PWD/packaging/corium.spec" \
            outdir="$outdir"
          shopt -s nullglob
          srpms=("$outdir"/*.src.rpm)
          test "${#srpms[@]}" -eq 1
          test ! -e vendor
          echo "SRPM=${srpms[0]}" >> "$GITHUB_ENV"

      - name: Build RPM (rpmbuild --rebuild)
        shell: bash
        run: |
          set -euo pipefail
          top=$(mktemp -d)
          dnf -y install cargo-rpm-macros cargo2rpm
          dnf -y builddep "$SRPM"
          rc=0
          rpmbuild -rr --define "_topdir $top" "$SRPM" || rc=$?
          test "$rc" -eq 0 || test "$rc" -eq 11
          shopt -s nullglob
          nosrc=("$top"/SRPMS/*.buildreqs.nosrc.rpm)
          if [ "${#nosrc[@]}" -gt 0 ]; then dnf -y builddep "${nosrc[@]}"; fi
          rpmbuild --rebuild --define "_topdir $top" "$SRPM"
          ls -l "$top"/RPMS/*/

  # Rootless QEMU/KVM boot coverage runs separately; see CONTRIBUTING.md.
  test:
    name: test (${{ matrix.toolchain }})
    strategy:
      matrix:
        toolchain: [stable, "1.89.0"]
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  musl:
    name: static init (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --target ${{ matrix.target }}
