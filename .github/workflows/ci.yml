name: CI

on:
  # An opened or updated pull request starts its build and test checks.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A group names runs that GitHub handles together. Each main run has its
# own group. Other runs share a group by check name and pull request or
# branch. A replacement run cancels an active run in that shared group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  license-headers:
    name: license headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install HawkEye
        uses: taiki-e/install-action@v2.90.0
        with:
          tool: hawkeye@6.5.0
      - run: hawkeye check --config licenserc.toml

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  commit-messages:
    name: commit messages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          PR_BASE: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
            commit_range="origin/$PR_BASE..HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] &&
               git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null &&
               git merge-base --is-ancestor "$PUSH_BEFORE" HEAD; then
            commit_range="$PUSH_BEFORE..HEAD"
          else
            git fetch --no-tags origin main:refs/remotes/origin/main
            commit_range="origin/main..HEAD"
            if [ "$(git rev-list --count "$commit_range")" -eq 0 ]; then
              echo "No new commits to check"
              exit 0
            fi
          fi
          pipx run gitlint --commits "$commit_range"

  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features

  # Rootless QEMU/KVM boot coverage runs separately; see CONTRIBUTING.md.
  test:
    name: test (${{ matrix.toolchain }})
    strategy:
      matrix:
        toolchain: [stable, "1.89.0"]
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  musl:
    name: static init (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
