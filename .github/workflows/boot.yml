name: VM boot validation

on:
  # An opened or updated pull request starts its build and test checks.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A group names runs that GitHub handles together. Each main run has its
# own group. Other runs share a group by check name and pull request or
# branch. A replacement run cancels an active run in that shared group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install VM test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            qemu-system-x86 cryptsetup-bin dmsetup fdisk e2fsprogs cpio kmod \
            squashfs-tools xz-utils gzip zstd
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod a+r "/boot/vmlinuz-$(uname -r)"
      - run: cargo +stable test --locked --test boot -- --ignored --test-threads=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-logs
          path: |
            target/boot-tests-*/*.log
            target/boot-tests-*/*.json
            target/boot-tests-*/*.jsonl
            target/boot-tests-*/*.txt
            target/boot-tests-*/*.diff
            target/boot-tests-*/*/fixture.json
            target/boot-tests-*/*/guest-inputs.json
